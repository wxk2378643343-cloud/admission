{% extends "base.html" %}
{% block content %}
<h2 class="h4">成绩列表</h2>
<table class="table table-striped">
  <thead><tr><th>ID</th><th>考生ID</th><th>科目</th><th>分数</th><th>总分</th></tr></thead>
  <tbody>
  {% for s in scores %}
  <tr><td>{{ s.id }}</td><td>{{ s.candidate_id }}</td><td>{{ s.subject }}</td><td>{{ s.score }}</td><td>{{ s.total_score }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
