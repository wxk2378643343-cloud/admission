{% extends "base.html" %}
{% block content %}
<h2 class="h4">志愿列表</h2>
<table class="table table-striped">
  <thead><tr><th>ID</th><th>考生ID</th><th>批次</th><th>院校</th><th>专业</th><th>优先级</th></tr></thead>
  <tbody>
  {% for c in choices %}
  <tr><td>{{ c.id }}</td><td>{{ c.candidate_id }}</td><td>{{ c.batch }}</td><td>{{ c.university }}</td><td>{{ c.major }}</td><td>{{ c.priority }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
