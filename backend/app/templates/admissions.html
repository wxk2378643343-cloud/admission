{% extends "base.html" %}
{% block content %}
<h2 class="h4">录取结果</h2>
<table class="table table-striped">
  <thead><tr><th>ID</th><th>考生ID</th><th>院校</th><th>专业</th><th>状态</th></tr></thead>
  <tbody>
  {% for a in admissions %}
  <tr><td>{{ a.id }}</td><td>{{ a.candidate_id }}</td><td>{{ a.university }}</td><td>{{ a.major }}</td><td>{{ a.status }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
