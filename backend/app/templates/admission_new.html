{% extends "base.html" %}
{% block content %}
<h2 class="h4">发布录取结果</h2>
<form method="post" action="/admission/new" class="card card-body">
  <input class="form-control mb-2" name="candidate_id" placeholder="candidate_id" required>
  <input class="form-control mb-2" name="university" placeholder="院校" required>
  <input class="form-control mb-2" name="major" placeholder="专业" required>
  <select class="form-select mb-2" name="status">
    <option value="admitted">admitted</option>
    <option value="pending">pending</option>
    <option value="rejected">rejected</option>
  </select>
  <button class="btn btn-primary">提交</button>
</form>
{% endblock %}
