{% extends "base.html" %}
{% block content %}
<h2 class="h4">考生信息</h2>
<table class="table table-bordered">
  <thead><tr><th>ID</th><th>准考证</th><th>姓名</th><th>手机号</th><th>操作</th></tr></thead>
  <tbody>
  {% for p in profiles %}
  <tr>
    <td>{{ p.id }}</td><td>{{ p.exam_no }}</td><td>{{ p.name }}</td><td>{{ p.phone }}</td>
    <td><a class="btn btn-sm btn-outline-primary" href="/profile/{{ p.id }}">详情</a></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
