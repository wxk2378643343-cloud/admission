<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title if title else '招生录取系统(未防护版)' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">招生录取系统(未防护版)</a>
    <div>
      {% if user %}
      <span class="text-light me-3">{{ user.username }} ({{ user.role }})</span>
      <a class="btn btn-sm btn-outline-light" href="/dashboard">控制台</a>
      <a class="btn btn-sm btn-warning" href="/logout">退出</a>
      {% else %}
      <a class="btn btn-sm btn-outline-light" href="/login">登录</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
</body>
</html>
