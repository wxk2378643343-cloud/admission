{% extends "base.html" %}
{% block content %}
<h2 class="h4">公告区（存储型 XSS 演示）</h2>
<form method="post" action="/notice" class="card card-body mb-3">
  <input class="form-control mb-2" name="title" placeholder="标题" required>
  <textarea class="form-control mb-2" name="content" placeholder="内容" rows="3" required></textarea>
  <button class="btn btn-primary">发布</button>
</form>
{% for n in notices %}
<div class="card mb-2">
  <div class="card-body">
    <h5>{{ n.title }}</h5>
    <div>{{ n.content | safe }}</div>
  </div>
</div>
{% endfor %}
{% endblock %}
