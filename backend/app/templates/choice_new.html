{% extends "base.html" %}
{% block content %}
<h2 class="h4">新增志愿</h2>
<form method="post" action="/choice/new" class="card card-body">
  <input class="form-control mb-2" name="candidate_id" placeholder="candidate_id" required>
  <input class="form-control mb-2" name="batch" placeholder="批次" required>
  <input class="form-control mb-2" name="university" placeholder="院校" required>
  <input class="form-control mb-2" name="major" placeholder="专业" required>
  <input class="form-control mb-2" name="priority" placeholder="优先级" required>
  <button class="btn btn-primary">提交</button>
</form>
{% endblock %}
